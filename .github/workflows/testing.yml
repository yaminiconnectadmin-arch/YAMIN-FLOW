name: Continuous Testing Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

jobs:
  test-suite:
    name: Lint, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install || yarn install

      - name: Install Python Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-xdist httpx anyio pydantic fastapi motor pymongo

      - name: Run ESLint & Code Formatting Checks
        working-directory: ./frontend
        run: |
          npx eslint "src/**/*.{js,jsx}" --max-warnings=0 || true

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build || yarn build

      - name: Run Python Backend Unit & Integration Tests
        run: pytest tests/unit/test_core.py tests/integration/test_api_db.py tests/security/test_security.py tests/regression/test_regression.py -o addopts=""

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium
        continue-on-error: true
