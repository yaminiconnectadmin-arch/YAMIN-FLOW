rules:
  - id: avoid-eval
    pattern: eval(...)
    message: "Avoid eval(): allows dynamic execution of arbitrary strings leading to Remote Code Execution."
    severity: ERROR
    languages:
      - javascript
      - python

  - id: prevent-hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: jwt.encode(..., secret="...", ...)
          - pattern: jwt.decode(..., secret="...", ...)
    message: "Hardcoded JWT secret detected. Always use environment variables."
    severity: ERROR
    languages:
      - python

  - id: require-parameterized-queries
    pattern: db.$COLLECTION.find({ $where: ... })
    message: "Avoid raw $where MongoDB queries to prevent NoSQL injection."
    severity: ERROR
    languages:
      - javascript
      - python
